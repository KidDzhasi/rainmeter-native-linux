[Rainmeter]
Update=500
AccurateText=1
AnchorX=Center
AnchorY=Bottom
WindowX=503
WindowY=610
SkinWidth=360
SkinHeight=110

[Variables]
@include=../Theme.inc

[Metadata]
Name=MusicBanner
Author=Trad Desktop
Information=Modern banner music player with album art, track info, progress bar, and vector MPRIS controls

[MeasureTitle]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Title

[MeasureArtist]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Artist

[MeasureAlbum]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Album

[MeasureCover]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Cover

[MeasureIsPlaying]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPlaying

[MeasureIsPaused]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPaused

[MeasureProgress]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Progress

[MeasurePos]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Position

[MeasureDur]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Duration

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,360,110,#CornerRadius# | #BgFill# | #BorderStroke#
Shape2=Ellipse 52,52,36,36 | Fill Color #TrackColor# | StrokeWidth 2 | Stroke Color #AccentColor#
Shape3=Ellipse 45,58,5.5,4 | Fill Color #AccentColor# | StrokeWidth 0
Shape4=Ellipse 59,55,5.5,4 | Fill Color #AccentColor# | StrokeWidth 0
Shape5=Rectangle 48,38,2.5,20,1 | Fill Color #AccentColor# | StrokeWidth 0
Shape6=Rectangle 62,35,2.5,20,1 | Fill Color #AccentColor# | StrokeWidth 0
Shape7=Polygon 48,38, 64.5,35, 64.5,40, 48,43 | Fill Color #AccentColor# | StrokeWidth 0

[MeterCoverArt]
Meter=Image
MeasureName=MeasureCover
X=16
Y=16
W=72
H=72
PreserveAspectRatio=1
SolidColor=0,0,0,0

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=104
Y=13
W=240
H=22
FontFace=Sans
FontSize=12
FontColor=#TextColor#
StringAlign=Left
ClipString=1
Text="%1"
AntiAlias=1

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=104
Y=35
W=162
H=18
FontFace=Sans
FontSize=10
FontColor=#AccentColor#
StringAlign=Left
ClipString=1
Text="%1"
AntiAlias=1

[MeterTime]
Meter=String
MeasureName=MeasurePos
MeasureName2=MeasureDur
X=344
Y=36
FontFace=Sans
FontSize=9
FontColor=#SubTextColor#
StringAlign=Right
Text="%1 / %2"
AntiAlias=1

; --- VECTOR REPEAT ICON ---
[MeterBtnRepeat]
Meter=Shape
X=114
Y=58
W=28
H=28
Shape=Rectangle 6,8,11,2,1 | Fill Color #SubTextColor# | StrokeWidth 0
Shape2=Polygon 22,9, 17,5.5, 17,12.5 | Fill Color #SubTextColor# | StrokeWidth 0
Shape3=Rectangle 6,8,2,6,1 | Fill Color #SubTextColor# | StrokeWidth 0
Shape4=Rectangle 11,18,11,2,1 | Fill Color #SubTextColor# | StrokeWidth 0
Shape5=Polygon 6,19, 11,15.5, 11,22.5 | Fill Color #SubTextColor# | StrokeWidth 0
Shape6=Rectangle 20,14,2,6,1 | Fill Color #SubTextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Repeat"]

; --- VECTOR PREVIOUS ICON (|◀) ---
[MeterBtnPrev]
Meter=Shape
X=156
Y=58
W=28
H=28
Shape=Rectangle 6,7,2.5,14,1 | Fill Color #TextColor# | StrokeWidth 0
Shape2=Polygon 10,14, 21,7, 21,21 | Fill Color #TextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]

; --- VECTOR PLAY/PAUSE BUTTON ---
[MeterBtnPlayIcon]
Meter=Shape
X=198
Y=56
W=32
H=32
Hidden=[MeasureIsPlaying]
Shape=Ellipse 16,16,15,15 | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Polygon 22,16, 12.5,10, 12.5,22 | Fill Color 10,14,22,255 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterBtnPauseIcon]
Meter=Shape
X=198
Y=56
W=32
H=32
Hidden=[MeasureIsPaused]
Shape=Ellipse 16,16,15,15 | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Rectangle 11,10,3.5,12,1.2 | Fill Color 10,14,22,255 | StrokeWidth 0
Shape3=Rectangle 17.5,10,3.5,12,1.2 | Fill Color 10,14,22,255 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

; --- VECTOR NEXT ICON (▶|) ---
[MeterBtnNext]
Meter=Shape
X=244
Y=58
W=28
H=28
Shape=Polygon 18,14, 7,7, 7,21 | Fill Color #TextColor# | StrokeWidth 0
Shape2=Rectangle 19.5,7,2.5,14,1 | Fill Color #TextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]

; --- VECTOR SHUFFLE ICON ---
[MeterBtnShuffle]
Meter=Shape
X=286
Y=58
W=28
H=28
Shape=Line 6,19, 18,9 | StrokeWidth 2.2 | Stroke Color #SubTextColor#
Shape2=Line 6,9, 18,19 | StrokeWidth 2.2 | Stroke Color #SubTextColor#
Shape3=Polygon 22,9, 17,5.5, 17,12.5 | Fill Color #SubTextColor# | StrokeWidth 0
Shape4=Polygon 22,19, 17,15.5, 17,22.5 | Fill Color #SubTextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Shuffle"]

[MeterProgressBar]
Meter=Bar
MeasureName=MeasureProgress
X=16
Y=96
W=328
H=5
BarOrientation=Horizontal
BarColor=#AccentColor#
SolidColor=#TrackColor#
