[Rainmeter]
Update=500
AccurateText=1
AnchorX=Center
AnchorY=Top
WindowX=533
WindowY=22
SkinWidth=300
SkinHeight=68

[Variables]
@include=../Theme.inc

[Metadata]
Name=MusicCompact
Author=Trad Rainmeter
Information=Compact pill media control bar with live track ticker, vector icons, and progress bar

[MeasureTitle]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Title

[MeasureArtist]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Artist

[MeasureIsPlaying]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPlaying

[MeasureIsPaused]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPaused

[MeasureProgress]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Progress

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,300,68,#CornerRadius# | #BgFill# | #BorderStroke#

[MeterTrack]
Meter=String
MeasureName=MeasureTitle
X=18
Y=10
W=168
H=20
FontFace=Sans
FontSize=10
FontColor=#TextColor#
StringAlign=Left
ClipString=1
Text="%1"
AntiAlias=1

[MeterSubArtist]
Meter=String
MeasureName=MeasureArtist
X=18
Y=28
W=168
H=16
FontFace=Sans
FontSize=9
FontColor=#SubTextColor#
StringAlign=Left
ClipString=1
Text="%1"
AntiAlias=1

; --- VECTOR PREVIOUS (|◀) ---
[MeterPrev]
Meter=Shape
X=196
Y=14
W=26
H=26
Shape=Rectangle 5,6,2.2,14,1 | Fill Color #TextColor# | StrokeWidth 0
Shape2=Polygon 8.5,13, 19,6, 19,20 | Fill Color #TextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]

; --- VECTOR PLAY / PAUSE ---
[MeterPlay]
Meter=Shape
X=226
Y=13
W=28
H=28
Hidden=[MeasureIsPlaying]
Shape=Ellipse 14,14,13,13 | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Polygon 19,14, 11,9, 11,19 | Fill Color 10,14,22,255 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterPause]
Meter=Shape
X=226
Y=13
W=28
H=28
Hidden=[MeasureIsPaused]
Shape=Ellipse 14,14,13,13 | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Rectangle 9.5,9,3,10,1 | Fill Color 10,14,22,255 | StrokeWidth 0
Shape3=Rectangle 15.5,9,3,10,1 | Fill Color 10,14,22,255 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

; --- VECTOR NEXT (▶|) ---
[MeterNext]
Meter=Shape
X=258
Y=14
W=26
H=26
Shape=Polygon 17.5,13, 7,6, 7,20 | Fill Color #TextColor# | StrokeWidth 0
Shape2=Rectangle 18.8,6,2.2,14,1 | Fill Color #TextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]

[MeterProgress]
Meter=Bar
MeasureName=MeasureProgress
X=18
Y=54
W=264
H=4
BarOrientation=Horizontal
BarColor=#AccentColor#
SolidColor=#TrackColor#
