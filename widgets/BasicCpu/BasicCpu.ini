[Rainmeter]
Update=1000
AccurateText=1
AnchorX=Left
AnchorY=Bottom
WindowX=36
WindowY=490
SkinWidth=135
SkinHeight=145

[Variables]
@include=../Theme.inc

[MeasureCPU]
Measure=CPU

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,135,145,#CornerRadius# | #BgFill# | #BorderStroke#
Shape2=Ellipse 67,68,46,46 | Fill Color 0,0,0,0 | StrokeWidth 7 | Stroke Color #TrackColor#

[MeterRing]
Meter=Roundline
MeasureName=MeasureCPU
X=2
Y=3
W=130
H=130
StartAngle=4.7123889
RotationAngle=6.2831853
LineStart=42
LineLength=50
Solid=1
LineColor=#AccentColor#

[MeterVal]
Meter=String
MeasureName=MeasureCPU
X=67
Y=58
FontFace=Sans
FontSize=15
FontColor=#TextColor#
StringAlign=CenterCenter
Text="%1%"
AntiAlias=1

[MeterLabel]
Meter=String
X=67
Y=82
FontFace=Sans
FontSize=10
FontColor=#SubTextColor#
StringAlign=CenterCenter
Text="CPU"
AntiAlias=1
