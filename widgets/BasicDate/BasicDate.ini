[Rainmeter]
Update=1000
AnchorX=Center
AnchorY=Center
WindowX=558
WindowY=329
SkinWidth=235
SkinHeight=130

[Variables]
@include=../Theme.inc

[MeasureDay]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%B

[MeasureYear]
Measure=Time
Format=%Y

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,235,130,#CornerRadius# | #BgFill# | #BorderStroke#
X=0
Y=0

[MeterDay]
Meter=String
MeasureName=MeasureDay
Text=%1
FontColor=#TextColor#
FontSize=20
StringAlign=Right
X=220
Y=10

[MeterMonth]
Meter=String
MeasureName=MeasureMonth
Text=%1
FontColor=#AccentColor#
FontSize=22
StringAlign=Right
X=220
Y=46

[MeterYear]
Meter=String
MeasureName=MeasureYear
Text=%1
FontColor=#TextColor#
FontSize=20
StringAlign=Right
X=220
Y=86
