MeasureName=MeasureNetOut
X=2
Y=7
W=130
H=130
StartAngle=4.7123889
RotationAngle=6.2831853
LineStart=31
LineLength=37
Solid=1
LineColor=#TextColor#

[MeterNetTitle]
