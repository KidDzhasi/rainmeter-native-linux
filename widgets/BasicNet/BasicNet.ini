[Rainmeter]
Update=1000
AccurateText=1
AnchorX=Right
AnchorY=Top
WindowX=1205
WindowY=35
SkinWidth=135
SkinHeight=155

[Variables]
@include=../Theme.inc

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeterBG]
