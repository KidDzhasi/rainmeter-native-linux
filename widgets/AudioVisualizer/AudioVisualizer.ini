[Rainmeter]
Update=33
AccurateText=1
AnchorX=Left
AnchorY=Bottom
WindowX=150
WindowY=600
SkinWidth=340
SkinHeight=120

[Variables]
@include=../Theme.inc

[Metadata]
Name=AudioVisualizer
Author=Trad Rainmeter
Information=20-band real-time PulseAudio / PipeWire desktop audio spectrum visualizer

[MeasureAudio]
