[Rainmeter]
Update=1000
AnchorX=Left
AnchorY=Top
WindowX=50
WindowY=165
SkinWidth=260
SkinHeight=160

[Variables]
@include=../Theme.inc
@include2=../Notes.inc

[Metadata]
Name=BasicNotes
Author=Trad Desktop
Information=Interactive desktop Sticky Notes widget. Click anywhere on the sticky note to write or edit your notes.

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,260,160,#CornerRadius# | #BgFill# | #BorderStroke#
Shape2=Line 14,38,246,38 | StrokeWidth 1 | Stroke Color #AccentColor#
X=0
Y=0
LeftMouseUpAction=[!NotesPopup]

[MeterTitle]
Meter=String
Text=#NoteTitle#  [Edit]
FontColor=#AccentColor#
FontSize=11
X=14
Y=12
W=232
H=22
ClipString=1
AntiAlias=1
LeftMouseUpAction=[!NotesPopup]

[MeterBody]
Meter=String
Text=#NoteBody#
FontColor=#TextColor#
FontSize=10
X=14
Y=48
W=232
H=100
ClipString=2
AntiAlias=1
LeftMouseUpAction=[!NotesPopup]
