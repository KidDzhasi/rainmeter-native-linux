[Rainmeter]
Update=1000
AccurateText=1
AnchorX=Center
AnchorY=Top
WindowX=580
WindowY=95
SkinWidth=200
SkinHeight=200

[Variables]
@include=../Theme.inc

[MeasureHourMin]
Measure=Time
Format=%I:%M

[MeasureSec]
Measure=Time
Format=%S
MinValue=0
MaxValue=60

[MeasureAmPm]
Measure=Time
Format=%p

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,200,200,#CornerRadius# | #BgFill# | #BorderStroke#
Shape2=Ellipse 100,100,82,82 | Fill Color 0,0,0,0 | StrokeWidth 5 | Stroke Color #TrackColor#
Shape3=Ellipse 100,100,66,66 | Fill Color #TrackColor# | StrokeWidth 1.5 | Stroke Color #AccentColor#

[MeterSecRing]
Meter=Roundline
MeasureName=MeasureSec
X=0
Y=0
W=200
H=200
StartAngle=4.7123889
RotationAngle=6.2831853
LineStart=79
LineLength=85
Solid=1
LineColor=#AccentColor#

[MeterSubLabel]
Meter=String
X=100
Y=62
FontFace=Sans
FontSize=9
FontColor=#SubTextColor#
StringAlign=CenterCenter
Text="CURRENT TIME"
AntiAlias=1

[MeterTimeText]
Meter=String
MeasureName=MeasureHourMin
X=100
Y=98
FontFace=Sans
FontSize=28
FontColor=#TextColor#
StringAlign=CenterCenter
Text="%1"
AntiAlias=1

[MeterAmPm]
Meter=String
MeasureName=MeasureAmPm
X=100
Y=134
FontFace=Sans
FontSize=11
FontColor=#AccentColor#
StringAlign=CenterCenter
Text="%1"
AntiAlias=1
