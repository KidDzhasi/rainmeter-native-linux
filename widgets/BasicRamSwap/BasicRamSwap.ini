[Rainmeter]
Update=1000
AccurateText=1
AnchorX=Left
AnchorY=Top
WindowX=24
WindowY=20
SkinWidth=230
SkinHeight=145

[Variables]
@include=../Theme.inc

[MeasureRAM]
Measure=PhysicalMemory

[MeasureSwap]
Measure=SwapMemory

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,230,145,#CornerRadius# | #BgFill# | #BorderStroke#
Shape2=Ellipse 62,68,42,42 | Fill Color 0,0,0,0 | StrokeWidth 6 | Stroke Color #TrackColor#
Shape3=Ellipse 168,68,42,42 | Fill Color 0,0,0,0 | StrokeWidth 6 | Stroke Color #TrackColor#

[MeterRamRing]
Meter=Roundline
MeasureName=MeasureRAM
X=2
Y=8
W=120
H=120
StartAngle=4.7123889
RotationAngle=6.2831853
LineStart=39
LineLength=45
Solid=1
LineColor=#AccentColor#

[MeterSwapRing]
Meter=Roundline
MeasureName=MeasureSwap
X=108
Y=8
W=120
H=120
StartAngle=4.7123889
RotationAngle=6.2831853
LineStart=39
LineLength=45
Solid=1
LineColor=#AccentColor#

[MeterRamVal]
Meter=String
MeasureName=MeasureRAM
X=62
Y=60
FontFace=Sans
FontSize=14
FontColor=#TextColor#
StringAlign=CenterCenter
Text="%1%"
AntiAlias=1

[MeterRamLbl]
Meter=String
X=62
Y=80
FontFace=Sans
FontSize=9
FontColor=#SubTextColor#
StringAlign=CenterCenter
Text="RAM"
AntiAlias=1

[MeterSwapVal]
Meter=String
MeasureName=MeasureSwap
X=168
Y=60
FontFace=Sans
FontSize=14
FontColor=#TextColor#
StringAlign=CenterCenter
Text="%1%"
AntiAlias=1

[MeterSwapLbl]
Meter=String
X=168
Y=80
FontFace=Sans
FontSize=9
FontColor=#SubTextColor#
StringAlign=CenterCenter
Text="SWAP"
AntiAlias=1
