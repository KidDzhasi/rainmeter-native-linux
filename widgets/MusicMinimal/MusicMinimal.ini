[Rainmeter]
Update=500
AccurateText=1
AnchorX=Center
AnchorY=Bottom
WindowX=523
WindowY=610
SkinWidth=320
SkinHeight=115

[Variables]
@include=../Theme.inc

[Metadata]
Name=MusicMinimal
Author=Trad Rainmeter
Information=Minimal floating music player with circular neon vector buttons and progress line

[MeasureTitle]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Title

[MeasureArtist]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Artist

[MeasureIsPlaying]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPlaying

[MeasureIsPaused]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPaused

[MeasureProgress]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Progress

[MeasurePos]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Position

[MeasureDur]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Duration

[MeterTitleArtist]
Meter=String
MeasureName=MeasureArtist
MeasureName2=MeasureTitle
X=160
Y=6
W=305
H=22
FontFace=Sans
FontSize=12
FontColor=#TextColor#
StringAlign=Center
ClipString=1
Text="%1 — %2"
AntiAlias=1

[MeterTimeInfo]
Meter=String
MeasureName=MeasurePos
MeasureName2=MeasureDur
X=160
Y=28
FontFace=Sans
FontSize=10
FontColor=#SubTextColor#
StringAlign=Center
Text="%1  /  %2"
AntiAlias=1

[MeterProgressLine]
Meter=Bar
MeasureName=MeasureProgress
X=25
Y=48
W=270
H=3
BarOrientation=Horizontal
BarColor=#AccentColor#
SolidColor=#TrackColor#

; --- 1. REPEAT CIRCLE BUTTON ---
[MeterBtnRepeat]
Meter=Shape
X=60
Y=64
W=32
H=32
Shape=Ellipse 16,16,15,15 | Fill Color #TrackColor# | StrokeWidth 1.5 | Stroke Color #AccentColor#
Shape2=Rectangle 9,11,9,2,1 | Fill Color #TextColor# | StrokeWidth 0
Shape3=Polygon 22,12, 18,9, 18,15 | Fill Color #TextColor# | StrokeWidth 0
Shape4=Rectangle 9,11,2,5,1 | Fill Color #TextColor# | StrokeWidth 0
Shape5=Rectangle 14,19,9,2,1 | Fill Color #TextColor# | StrokeWidth 0
Shape6=Polygon 10,20, 14,17, 14,23 | Fill Color #TextColor# | StrokeWidth 0
Shape7=Rectangle 21,16,2,5,1 | Fill Color #TextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Repeat"]

; --- 2. PREVIOUS CIRCLE BUTTON (|◀) ---
[MeterBtnPrev]
Meter=Shape
X=100
Y=63
W=34
H=34
Shape=Ellipse 17,17,16,16 | Fill Color #TrackColor# | StrokeWidth 1.5 | Stroke Color #AccentColor#
Shape2=Rectangle 10,11,2.2,12,1 | Fill Color #TextColor# | StrokeWidth 0
Shape3=Polygon 13,17, 23,11, 23,23 | Fill Color #TextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]

; --- 3. PLAY / PAUSE CENTER CIRCLE BUTTON ---
[MeterBtnPlay]
Meter=Shape
X=140
Y=60
W=40
H=40
Hidden=[MeasureIsPlaying]
Shape=Ellipse 20,20,19,19 | Fill Color #AccentColor# | StrokeWidth 2 | Stroke Color #TextColor#
Shape2=Polygon 27,20, 15,13, 15,27 | Fill Color 10,14,22,255 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterBtnPause]
Meter=Shape
X=140
Y=60
W=40
H=40
Hidden=[MeasureIsPaused]
Shape=Ellipse 20,20,19,19 | Fill Color #AccentColor# | StrokeWidth 2 | Stroke Color #TextColor#
Shape2=Rectangle 14,13,4,14,1.2 | Fill Color 10,14,22,255 | StrokeWidth 0
Shape3=Rectangle 22,13,4,14,1.2 | Fill Color 10,14,22,255 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

; --- 4. NEXT CIRCLE BUTTON (▶|) ---
[MeterBtnNext]
Meter=Shape
X=186
Y=63
W=34
H=34
Shape=Ellipse 17,17,16,16 | Fill Color #TrackColor# | StrokeWidth 1.5 | Stroke Color #AccentColor#
Shape2=Polygon 21,17, 11,11, 11,23 | Fill Color #TextColor# | StrokeWidth 0
Shape3=Rectangle 21.8,11,2.2,12,1 | Fill Color #TextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]

; --- 5. SHUFFLE CIRCLE BUTTON ---
[MeterBtnShuffle]
Meter=Shape
X=228
Y=64
W=32
H=32
Shape=Ellipse 16,16,15,15 | Fill Color #TrackColor# | StrokeWidth 1.5 | Stroke Color #AccentColor#
Shape2=Line 9,21, 19,11 | StrokeWidth 2 | Stroke Color #TextColor#
Shape3=Line 9,11, 19,21 | StrokeWidth 2 | Stroke Color #TextColor#
Shape4=Polygon 23,11, 18.5,8, 18.5,14 | Fill Color #TextColor# | StrokeWidth 0
Shape5=Polygon 23,21, 18.5,18, 18.5,24 | Fill Color #TextColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Shuffle"]
