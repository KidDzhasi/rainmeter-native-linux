[Rainmeter]
Update=5000
AnchorX=Center
AnchorY=Bottom
WindowX=565
WindowY=482
SkinWidth=235
SkinHeight=136

[Variables]
@include=../Theme.inc

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,235,136,#CornerRadius# | #BgFill# | #BorderStroke#
X=0
Y=0

[MeterStatus]
Meter=String
Text=Currently - Partly Cloudy
FontColor=#TextColor#
FontSize=10
X=12
Y=10

[MeterTemp]
Meter=String
Text=18°C
FontColor=#TextColor#
FontSize=26
X=95
Y=34

[MeterHumidity]
Meter=String
Text=Humidity: 68%
FontColor=#SubTextColor#
FontSize=8
X=12
Y=82

[MeterRain]
Meter=String
Text=Chance of rain: 15%
FontColor=#SubTextColor#
FontSize=8
X=12
Y=98

[MeterWind]
Meter=String
Text=Wind Speed: 8 km/h - ENE
FontColor=#SubTextColor#
FontSize=8
X=12
Y=114

[MeterDot]
Meter=Shape
Shape=Ellipse 218,118,6,6 | Fill Color #AccentColor# | StrokeWidth 0
X=0
Y=0
