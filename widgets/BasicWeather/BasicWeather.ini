[Rainmeter]
Update=1000
AnchorX=Center
AnchorY=Bottom
WindowX=565
WindowY=482
SkinWidth=250
SkinHeight=160

[Variables]
@include=../Theme.inc
@include2=../Weather.inc

[Metadata]
Name=BasicWeather
Author=Trad Desktop
Information=Live weather from Open-Meteo for any town or village. Change the location in Trad Desktop > Basic Widgets > Weather Location.

; --- LIVE WEATHER MEASURES (Open-Meteo, refreshes every 10 minutes) ---
[MeasureCondition]
Measure=Weather
Type=Condition

[MeasureTemp]
Measure=Weather
Type=Temperature

[MeasureTempUnit]
Measure=Weather
Type=TempUnit

[MeasureFeels]
Measure=Weather
Type=FeelsLike

[MeasureHigh]
Measure=Weather
Type=High

[MeasureLow]
Measure=Weather
Type=Low

[MeasureHumidity]
Measure=Weather
Type=Humidity

[MeasureRain]
Measure=Weather
Type=RainChance

[MeasureWind]
Measure=Weather
Type=WindSpeed

[MeasureWindUnit]
Measure=Weather
Type=SpeedUnit

[MeasureWindDir]
Measure=Weather
Type=WindDirection

[MeasureStatus]
Measure=Weather
Type=Status

; --- UI ---
[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,250,160,#CornerRadius# | #BgFill# | #BorderStroke#
X=0
Y=0
LeftMouseUpAction=[!WeatherPopup]

[MeterLocation]
Meter=String
Text=#WeatherLocation#
FontColor=#AccentColor#
FontSize=10
X=12
Y=10
W=226
H=18
ClipString=1
AntiAlias=1
LeftMouseUpAction=[!WeatherPopup]

[MeterStatus]
Meter=String
MeasureName=MeasureCondition
Text=Currently - %1
FontColor=#TextColor#
FontSize=9
X=12
Y=30
W=226
H=16
ClipString=1
AntiAlias=1
LeftMouseUpAction=[!WeatherPopup]

[MeterTemp]
Meter=String
MeasureName=MeasureTemp
MeasureName2=MeasureTempUnit
Text=%1%2
FontColor=#TextColor#
FontSize=26
X=238
Y=46
StringAlign=Right
AntiAlias=1
LeftMouseUpAction=[!WeatherPopup]

[MeterHiLo]
Meter=String
MeasureName=MeasureHigh
MeasureName2=MeasureLow
MeasureName3=MeasureFeels
Text=H %1°  L %2°  Feels %3°
FontColor=#SubTextColor#
FontSize=8
X=12
Y=60
AntiAlias=1

[MeterHumidity]
Meter=String
MeasureName=MeasureHumidity
Text=Humidity: %1%
FontColor=#SubTextColor#
FontSize=8
X=12
Y=94
AntiAlias=1

[MeterRain]
Meter=String
MeasureName=MeasureRain
Text=Chance of rain: %1%
FontColor=#SubTextColor#
FontSize=8
X=12
Y=110
AntiAlias=1

[MeterWind]
Meter=String
MeasureName=MeasureWind
MeasureName2=MeasureWindUnit
MeasureName3=MeasureWindDir
Text=Wind Speed: %1 %2 - %3
FontColor=#SubTextColor#
FontSize=8
X=12
Y=126
AntiAlias=1

[MeterUpdated]
Meter=String
MeasureName=MeasureStatus
Text=%1
FontColor=#SubTextColor#
FontSize=7
X=226
Y=142
StringAlign=Right
AntiAlias=1

[MeterDot]
Meter=Shape
Shape=Ellipse 236,148,4,4 | Fill Color #AccentColor# | StrokeWidth 0
X=0
Y=0
