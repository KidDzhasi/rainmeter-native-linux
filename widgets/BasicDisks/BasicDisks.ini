[Rainmeter]
Update=5000
AccurateText=1
AnchorX=Right
AnchorY=Center
WindowX=1110
WindowY=235
SkinWidth=230
SkinHeight=140

[Variables]
@include=../Theme.inc

[MeasureRoot]
Measure=FreeDiskSpace
Drive=/

[MeasureHome]
Measure=FreeDiskSpace
Drive=/home

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,230,140,#CornerRadius# | #BgFill# | #BorderStroke#
Shape2=Ellipse 62,66,40,40 | Fill Color 0,0,0,0 | StrokeWidth 6 | Stroke Color #TrackColor#
Shape3=Ellipse 168,66,40,40 | Fill Color 0,0,0,0 | StrokeWidth 6 | Stroke Color #TrackColor#

[MeterRootRing]
Meter=Roundline
MeasureName=MeasureRoot
X=2
Y=6
W=120
H=120
StartAngle=4.7123889
RotationAngle=6.2831853
LineStart=37
LineLength=43
Solid=1
LineColor=#AccentColor#

[MeterHomeRing]
Meter=Roundline
MeasureName=MeasureHome
X=108
Y=6
W=120
H=120
StartAngle=4.7123889
RotationAngle=6.2831853
LineStart=37
LineLength=43
Solid=1
LineColor=#AccentColor#

[MeterRootVal]
Meter=String
MeasureName=MeasureRoot
X=62
Y=58
FontFace=Sans
FontSize=12
FontColor=#TextColor#
StringAlign=CenterCenter
Text="%1%"
AntiAlias=1

[MeterRootLbl]
Meter=String
X=62
Y=78
FontFace=Sans
FontSize=9
FontColor=#SubTextColor#
StringAlign=CenterCenter
Text="ROOT /"
AntiAlias=1

[MeterHomeVal]
Meter=String
MeasureName=MeasureHome
X=168
Y=58
FontFace=Sans
FontSize=12
FontColor=#TextColor#
StringAlign=CenterCenter
Text="%1%"
AntiAlias=1

[MeterHomeLbl]
Meter=String
X=168
Y=78
FontFace=Sans
FontSize=9
FontColor=#SubTextColor#
StringAlign=CenterCenter
Text="/HOME"
AntiAlias=1
