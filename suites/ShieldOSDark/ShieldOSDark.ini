; --- BACKING PLATE, CONCENTRIC TECH RINGS & CALLOUT WINGS ---
[MeterShieldBase]
Meter=Shape
X=0
Y=0
Shape=Polygon 215,86, 405,86, 466,56, 634,56, 695,86, 885,86, 962,186, 972,282, 852,282, 852,398, 972,398, 962,494, 885,594, 695,594, 634,624, 466,624, 405,594, 215,594, 138,494, 128,398, 248,398, 248,282, 128,282, 138,186 | Fill Color 18,22,28,244 | StrokeWidth 2 | Stroke Color 95,112,135,215

; 4 Rectangular Callout Wings (drawn FIRST so orbital circular pods sit cleanly on top without inner seam overlap)
Shape2=Rectangle 164,194,184,68,16 | Fill Color 22,27,35,238 | StrokeWidth 2 | Stroke Color 220,232,246,238
Shape3=Rectangle 164,418,184,68,16 | Fill Color 22,27,35,238 | StrokeWidth 2 | Stroke Color 220,232,246,238
Shape4=Rectangle 752,194,184,68,16 | Fill Color 22,27,35,238 | StrokeWidth 2 | Stroke Color 220,232,246,238
Shape5=Rectangle 752,418,184,68,16 | Fill Color 22,27,35,238 | StrokeWidth 2 | Stroke Color 220,232,246,238
; Central Concentric Rings (center = 550, 340)
Shape6=Ellipse 550,340,188,188 | Fill Color 0,0,0,0 | StrokeWidth 3 | Stroke Color 220,232,246,238
Shape7=Ellipse 550,340,170,170 | Fill Color 0,0,0,0 | StrokeWidth 6 | Stroke Color 120,132,148,140
Shape8=Ellipse 550,340,152,152 | Fill Color 20,25,33,246 | StrokeWidth 3 | Stroke Color 220,232,246,238
