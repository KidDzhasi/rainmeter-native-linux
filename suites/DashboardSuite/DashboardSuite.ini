[Rainmeter]
Update=1000
@Monitor=0
AnchorX=Left
AnchorY=Top

; --- MEASURES ---
[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDateNum]
Measure=Time
Format=%d

[MeasureMonthName]
Measure=Time
Format=%B

[MeasureDayName]
Measure=Time
Format=%A

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

; --- CARD 1: WELCOME USER (Top Left) ---
[MeterWelcomeBG]
Meter=Image
X=50
Y=50
W=260
H=100
SolidColor=15,23,42,245

[MeterWelcomeText]
Meter=String
X=75
Y=70
FontSize=12
FontFace=Rajdhani
FontColor=140,210,255,255
Text=Welcome, User
AntiAlias=1

[MeterUserName]
Meter=String
X=75
Y=95
FontSize=18
FontFace=Orbitron
FontColor=255,255,255,255
Text=Xitsundzuxo
AntiAlias=1

; --- CARD 2: NOTES (Middle Left) ---
[MeterNotesBG]
Meter=Image
X=50
Y=165
W=260
H=140
SolidColor=15,23,42,245

[MeterNotesTitle]
Meter=String
X=180
Y=180
StringAlign=Center
FontSize=14
FontFace=Rajdhani
FontColor=255,180,70,255
Text=Notes
AntiAlias=1

[MeterNotesBody]
Meter=String
X=70
Y=220
FontSize=12
FontFace=Rajdhani
FontColor=210,220,235,255
Text=Don't forget to check your mail!
AntiAlias=1

; --- CARD 3: WEATHER (Upper Right Edge) ---
[MeterWeatherBG]
Meter=Image
X=1056
Y=50
W=260
H=130
SolidColor=15,23,42,245

[MeterWeatherCity]
Meter=String
X=1081
Y=70
FontSize=13
FontFace=Rajdhani
FontColor=140,210,255,255
Text=Johannesburg, South Africa
AntiAlias=1

[MeterWeatherTemp]
Meter=String
X=1081
Y=100
FontSize=36
FontFace=Orbitron
FontColor=255,180,70,255
Text=11°C
AntiAlias=1

; --- CARD 4: LIVE CALENDAR / DATE (Far Right Screen Edge) ---
[MeterDateBG]
Meter=Image
X=1056
Y=195
W=260
H=170
SolidColor=15,23,42,245

[MeterDayText]
Meter=String
MeasureName=MeasureDayName
X=1186
Y=215
StringAlign=Center
FontSize=15
FontFace=Rajdhani
FontColor=140,210,255,255
AntiAlias=1

[MeterDayNum]
Meter=String
MeasureName=MeasureDateNum
X=1186
Y=245
StringAlign=Center
FontSize=52
FontFace=Orbitron
FontColor=255,255,255,255
AntiAlias=1

[MeterMonthText]
Meter=String
MeasureName=MeasureMonthName
X=1186
Y=320
StringAlign=Center
FontSize=14
FontFace=Rajdhani
FontColor=255,180,70,255
AntiAlias=1

; --- SYSTEM METERS BAR (Just Above Dock) ---
[MeterSysBarBG]
Meter=Image
X=378
Y=598
W=610
H=70
SolidColor=15,23,42,245

[MeterCPULabel]
