[Rainmeter]
Update=1000
@Monitor=0
AnchorX=Left
AnchorY=Top

; --- MEASURES ---
[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%d %B %Y
FormatLocale=en-US

[MeasureDay]
Measure=Time
Format=%A
StringCase=Upper

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureSWAP]
Measure=SwapMemory

; --- 135-DEGREE DIAGONAL STAIR-STEP LAYOUT (Top-Left Grey Area) ---

; 1. Clock & Date (Base of diagonal flow with tech fonts)
[MeterDayLabel]
Meter=String
MeasureName=MeasureDay
X=60
Y=210
FontSize=11
FontFace=Share Tech Mono
FontColor=0, 220, 240, 255
AntiAlias=1

[MeterTimeText]
Meter=String
MeasureName=MeasureTime
X=60
Y=230
FontSize=46
FontFace=Orbitron
FontColor=255, 255, 255, 255
AntiAlias=1

[MeterDateText]
Meter=String
MeasureName=MeasureDate
X=60
Y=290
FontSize=13
FontFace=Share Tech Mono
FontColor=0, 220, 240, 255
AntiAlias=1

[MeterWeatherText]
Meter=String
X=60
Y=312
FontSize=11
FontFace=Share Tech Mono
FontColor=200, 215, 230, 200
Text=Mostly Cloudy | 15°C
AntiAlias=1

; 2. CPU Monitor (Stepped up and right along 135° geometry)
[MeterCPULabel]
Meter=String
X=190
Y=160
FontSize=12
FontFace=Rajdhani
FontColor=0, 220, 240, 255
Text=CPU:
AntiAlias=1

[MeterCPUBarBG]
Meter=Image
X=245
Y=168
W=130
H=5
SolidColor=40, 60, 80, 200

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=245
Y=168
W=130
H=5
BarColor=0, 220, 240, 255
BarOrientation=Horizontal

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
X=385
Y=160
FontSize=11
FontFace=Share Tech Mono
FontColor=255, 255, 255, 255
Text=%1%
AntiAlias=1

; 3. SWAP Monitor (Replacing HDD, stepped further up and right)
[MeterSwapLabel]
Meter=String
X=320
Y=110
FontSize=12
FontFace=Rajdhani
FontColor=0, 220, 240, 255
Text=SWAP:
AntiAlias=1

[MeterSwapBarBG]
Meter=Image
X=395
Y=118
W=130
H=5
SolidColor=40, 60, 80, 200

[MeterSwapBar]
Meter=Bar
MeasureName=MeasureSWAP
X=395
Y=118
W=130
H=5
BarColor=0, 220, 240, 255
BarOrientation=Horizontal

[MeterSwapValue]
Meter=String
MeasureName=MeasureSWAP
X=535
Y=110
FontSize=11
FontFace=Share Tech Mono
FontColor=255, 255, 255, 255
Text=%1%
AntiAlias=1

; 4. RAM Monitor (Top-right peak of diagonal flow)
[MeterRAMLabel]
Meter=String
X=450
Y=65
FontSize=12
FontFace=Rajdhani
FontColor=0, 220, 240, 255
Text=RAM:
AntiAlias=1

[MeterRAMBarBG]
Meter=Image
X=505
Y=73
W=130
H=5
SolidColor=40, 60, 80, 200

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=505
Y=73
W=130
H=5
BarColor=0, 220, 240, 255
BarOrientation=Horizontal

[MeterRAMValue]
Meter=String
MeasureName=MeasureRAM
X=645
Y=65
FontSize=11
FontFace=Share Tech Mono
FontColor=255, 255, 255, 255
Text=%1%
AntiAlias=1
