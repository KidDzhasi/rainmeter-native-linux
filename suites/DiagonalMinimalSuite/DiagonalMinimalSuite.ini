[Rainmeter]
Update=1000
AccurateText=1
AnchorX=Center
AnchorY=Center
SkinWidth=1366
SkinHeight=768
AutoFit=1

[Metadata]
Name=DiagonalMinimalSuite
Author=Trad Desktop
Information=Minimalist Monochrome Diagonal Ribbon Blades with High-Contrast Black & White Stadium Clock/Date Pills

[Variables]
@include=../../widgets/Theme.inc
@include2=../../widgets/Weather.inc
@include3=../../widgets/Notes.inc
AccentColor=0,210,255,255
TextColor=240,246,255,255
SubTextColor=175,190,215,240
TrackColor=32,38,52,220

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureTime12]
Measure=Time
Format=%I:%M %p

[MeasureTime12Short]
Measure=Time
Format=%I:%M

[MeasureHour]
Measure=Time
Format=%H

[MeasureHour12]
Measure=Time
Format=%I

[MeasureMinute]
Measure=Time
Format=%M

[MeasureSecond]
Measure=Time
Format=%S
MaxValue=60

[MeasureAMPM]
Measure=Time
Format=%p

[MeasureWeekday]
Measure=Time
Format=%A

[MeasureWeekdayShort]
Measure=Time
Format=%a

[MeasureDay]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%B

[MeasureMonthShort]
Measure=Time
Format=%b

[MeasureMonthUpper]
Measure=Time
Format=%b

[MeasureDateSlash]
Measure=Time
Format=%d/%m/%Y

[MeasureYear]
Measure=Time
Format=%Y

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureSWAP]
Measure=SwapMemory

[MeasureTemp]
Measure=Plugin
Plugin=CoreTemp

[MeasureRoot]
Measure=FreeDiskSpace
Drive=/

[MeasureHome]
Measure=FreeDiskSpace
Drive=/home

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeasureNetInKB]
Measure=Calc
Formula=MeasureNetIn / 1024

[MeasureNetOutKB]
Measure=Calc
Formula=MeasureNetOut / 1024

[MeasureBattery]
Measure=Battery

[MeasureWeatherTemp]
Measure=Weather
Type=Temperature

[MeasureWeatherUnit]
Measure=Weather
Type=TempUnit

[MeasureWeatherCond]
Measure=Weather
Type=Condition

[MeasureWeatherHigh]
Measure=Weather
Type=High

[MeasureWeatherLow]
Measure=Weather
Type=Low

[MeasureWeatherFeels]
Measure=Weather
Type=FeelsLike

[MeasureWeatherHum]
Measure=Weather
Type=Humidity

[MeasureWeatherRain]
Measure=Weather
Type=RainChance

[MeasureWeatherWind]
Measure=Weather
Type=WindSpeed

[MeasureWeatherSpeedUnit]
Measure=Weather
Type=SpeedUnit

[MeasureWeatherDir]
Measure=Weather
Type=WindDirection

[MeasureTrack]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Title

[MeasureArtist]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Artist

[MeasureAlbum]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Album

[MeasureCover]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Cover

[MeasurePlayIcon]
Measure=Plugin
Plugin=NowPlaying
PlayerType=StateButton

[MeasureIsPlaying]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPlaying

[MeasureIsPaused]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPaused

[MeasureProgress]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Progress
MaxValue=100

[MeasurePosition]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Position

[MeasureDuration]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Duration


; --- LEFT ANGLED BLACK BLADES & RIGHT STADIUM PILLS ---
