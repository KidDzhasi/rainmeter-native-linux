[Rainmeter]
Update=1000
@Monitor=0
AnchorX=Center
AnchorY=Center

; --- MEASURES ---
[MeasureHour]
Measure=Time
Format=%I

[MeasureMinute]
Measure=Time
Format=%M

[MeasureAMPM]
Measure=Time
Format=%p

[MeasureDay]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%B

[MeasureYear]
Measure=Time
Format=%Y

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureSWAP]
Measure=SwapMemory

; --- CPU BLOCK (Far Left) ---
[MeterCPUBG]
Meter=Image
X=0
Y=50
W=80
H=220
SolidColor=15,15,15,240

[MeterCPULabel]
Meter=String
X=40
Y=60
StringAlign=Center
FontSize=11
FontFace=Rajdhani
FontColor=180,180,180,255
Text=Cpu
AntiAlias=1

[MeterCPUBarBG]
Meter=Image
X=37
Y=90
W=6
H=130
SolidColor=255,255,255,20

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=37
Y=90
W=6
H=130
BarColor=0,255,255,255
BarOrientation=Vertical

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
X=40
Y=240
StringAlign=Center
FontSize=9
FontFace=Share Tech Mono
FontColor=255,255,255,255
Text=%1%
AntiAlias=1

; --- RAM & SWAP BLOCK ---
[MeterMemBG]
