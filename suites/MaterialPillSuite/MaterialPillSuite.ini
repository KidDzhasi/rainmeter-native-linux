X=480
Y=320
StringAlign=Center
FontFace=Sans
FontSize=24
FontColor=240,245,255,255
Text="%1"
AntiAlias=1

[MeterSysLabel]
Meter=String
X=425
Y=420
FontFace=Sans
FontSize=10
FontColor=190,200,220,240
Text="SYSTEM"
AntiAlias=1

[MeterSysVal]
