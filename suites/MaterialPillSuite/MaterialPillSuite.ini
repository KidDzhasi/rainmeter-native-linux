[Rainmeter]
Update=1000
AccurateText=1
AnchorX=Center
AnchorY=Center
SkinWidth=1366
SkinHeight=768
AutoFit=1

[Metadata]
Name=MaterialPillSuite
Author=Trad Desktop
Information=Minimalist Stacked Clock, 4-Color Side Ribbon & Colorful Material Telemetry Toggle Pills

[Variables]
@include=../../widgets/Theme.inc
@include2=../../widgets/Weather.inc
@include3=../../widgets/Notes.inc
AccentColor=0,210,255,255
TextColor=240,246,255,255
SubTextColor=175,190,215,240
TrackColor=32,38,52,220

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureTime12]
Measure=Time
Format=%I:%M %p

[MeasureTime12Short]
Measure=Time
Format=%I:%M

[MeasureHour]
Measure=Time
Format=%H

[MeasureHour12]
Measure=Time
Format=%I

[MeasureMinute]
Measure=Time
Format=%M

[MeasureSecond]
Measure=Time
Format=%S
MaxValue=60

[MeasureAMPM]
Measure=Time
Format=%p

[MeasureWeekday]
Measure=Time
Format=%A

[MeasureWeekdayShort]
Measure=Time
Format=%a

[MeasureDay]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%B

[MeasureMonthShort]
Measure=Time
Format=%b

[MeasureMonthUpper]
Measure=Time
Format=%b

[MeasureDateSlash]
Measure=Time
Format=%d/%m/%Y

[MeasureYear]
Measure=Time
Format=%Y

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureSWAP]
Measure=SwapMemory

[MeasureTemp]
Measure=Plugin
Plugin=CoreTemp

[MeasureRoot]
Measure=FreeDiskSpace
Drive=/

[MeasureHome]
Measure=FreeDiskSpace
Drive=/home

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeasureNetInKB]
Measure=Calc
Formula=MeasureNetIn / 1024

[MeasureNetOutKB]
Measure=Calc
Formula=MeasureNetOut / 1024

[MeasureBattery]
Measure=Battery

[MeasureWeatherTemp]
Measure=Weather
Type=Temperature

[MeasureWeatherUnit]
Measure=Weather
Type=TempUnit

[MeasureWeatherCond]
Measure=Weather
Type=Condition

[MeasureWeatherHigh]
Measure=Weather
Type=High

[MeasureWeatherLow]
Measure=Weather
Type=Low

[MeasureWeatherFeels]
Measure=Weather
Type=FeelsLike

[MeasureWeatherHum]
Measure=Weather
Type=Humidity

[MeasureWeatherRain]
Measure=Weather
Type=RainChance

[MeasureWeatherWind]
Measure=Weather
Type=WindSpeed

[MeasureWeatherSpeedUnit]
Measure=Weather
Type=SpeedUnit

[MeasureWeatherDir]
Measure=Weather
Type=WindDirection

[MeasureTrack]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Title

[MeasureArtist]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Artist

[MeasureAlbum]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Album

[MeasureCover]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Cover

[MeasurePlayIcon]
Measure=Plugin
Plugin=NowPlaying
PlayerType=StateButton

[MeasureIsPlaying]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPlaying

[MeasureIsPaused]
Measure=Plugin
Plugin=NowPlaying
PlayerType=IsPaused

[MeasureProgress]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Progress
MaxValue=100

[MeasurePosition]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Position

[MeasureDuration]
Measure=Plugin
Plugin=NowPlaying
PlayerType=Duration


; --- LEFT 4-COLOR RIBBON & FLOATING ACTION SQUARES ---
[MeterLeftRibbon]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,16,192,0 | Fill Color 30,115,215,255 | StrokeWidth 0
Shape2=Rectangle 0,192,16,192,0 | Fill Color 229,57,53,255 | StrokeWidth 0
Shape3=Rectangle 0,384,16,192,0 | Fill Color 251,192,45,255 | StrokeWidth 0
Shape4=Rectangle 0,576,16,192,0 | Fill Color 67,160,71,255 | StrokeWidth 0
; 4 Floating Icon Badges
Shape5=Rectangle 44,120,34,34,6 | Fill Color 30,115,215,245 | StrokeWidth 0
Shape6=Rectangle 44,280,34,34,6 | Fill Color 229,57,53,245 | StrokeWidth 0
Shape7=Rectangle 44,440,34,34,6 | Fill Color 251,192,45,245 | StrokeWidth 0
Shape8=Rectangle 44,600,34,34,6 | Fill Color 67,160,71,245 | StrokeWidth 0
; Vector icons inside the 4 floating badges
Shape9=Rectangle 52,128,18,12,2 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 255,255,255,255
Shape10=Line 56,144,66,144 | StrokeWidth 2 | Stroke Color 255,255,255,255
Shape11=Rectangle 52,289,18,15,2 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 255,255,255,255
Shape12=Line 55,294,67,294 | StrokeWidth 1.5 | Stroke Color 255,255,255,255
; Beamed double music note icon (♫) inside yellow badge
Shape13=Ellipse 56,462,3.5,2.8 | Fill Color 255,255,255,255 | StrokeWidth 0
Shape14=Ellipse 65,460,3.5,2.8 | Fill Color 255,255,255,255 | StrokeWidth 0
Shape15=Line 59,462,59,449 | StrokeWidth 2 | Stroke Color 255,255,255,255
Shape16=Line 68,460,68,447 | StrokeWidth 2 | Stroke Color 255,255,255,255
Shape17=Line 59,449,68,447 | StrokeWidth 2.5 | Stroke Color 255,255,255,255
; Globe icon inside green badge
Shape18=Ellipse 61,617,9,9 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 255,255,255,255
Shape19=Line 52,617,70,617 | StrokeWidth 1.5 | Stroke Color 255,255,255,255
Shape20=Line 61,608,61,626 | StrokeWidth 1.5 | Stroke Color 255,255,255,255

[MeterSideBtn1]
Meter=String
X=44
Y=120
W=34
H=34
Text=" "
LeftMouseUpAction=[!OpenControlCenter]

[MeterSideBtn2]
Meter=String
X=44
Y=280
W=34
H=34
Text=" "
LeftMouseUpAction=["xdg-open" "~"]

[MeterSideBtn3]
Meter=String
X=44
Y=440
W=34
H=34
Text=" "
LeftMouseUpAction=[!CommandMeasure MeasureTrack "PlayPause"]

[MeterSideBtn4]
Meter=String
X=44
Y=600
W=34
H=34
Text=" "
LeftMouseUpAction=[!WeatherPopup]

; --- CENTER-LEFT STACKED CLOCK & SYSTEM/USER ---
[MeterClockHour]
Meter=String
MeasureName=MeasureHour
X=480
Y=170
StringAlign=Center
FontFace=Sans
FontSize=24
FontColor=240,245,255,255
Text="%1"
AntiAlias=1

[MeterClockArrow]
