[Rainmeter]
Update=33
AccurateText=1
AnchorX=Center
AnchorY=Center
SkinWidth=1220
SkinHeight=660
AutoFit=1

[Metadata]
Name=CyberYellowHUD
Author=Trad Desktop
Information=Tactical Cyber-Yellow Sci-Fi HUD with 5 Radial Arc Dials, Radar Clock, Wireframe Music/Weather & 20-Band Spectrum Scope

[Variables]
@include=../../widgets/Theme.inc
@include2=../../widgets/Weather.inc
