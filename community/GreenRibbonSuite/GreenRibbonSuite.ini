[Rainmeter]
Update=1000
@Monitor=0
AnchorX=Center
AnchorY=Center

; --- MEASURES ---
[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

; --- LEFT CARD BACKGROUND (Weather + System) ---
[MeterLeftCardBG]
Meter=Image
X=0
Y=0
W=240
H=200
SolidColor=15, 23, 42, 210

; --- WEATHER SECTION ---
[MeterWeatherTitle]
Meter=String
X=15
Y=15
FontSize=13
FontFace=Rajdhani
FontColor=100, 210, 255, 255
Text=Partly Cloudy
AntiAlias=1

[MeterWeatherDetails]
Meter=String
X=15
Y=38
FontSize=10
FontFace=Rajdhani
FontColor=200, 215, 235, 200
Text=Johannesburg, South Africa
AntiAlias=1

[MeterWeatherTemp]
Meter=String
X=15
Y=70
FontSize=20
FontFace=Orbitron
FontColor=255, 180, 70, 255
Text=11°C
AntiAlias=1

; --- SYSTEM MONITOR SECTION ---
[MeterCPULabel]
Meter=String
X=15
Y=130
FontSize=11
FontFace=Rajdhani
FontColor=100, 210, 255, 255
Text=CPU
AntiAlias=1

[MeterCPUBarBG]
Meter=Image
X=60
Y=136
W=135
H=5
SolidColor=30, 41, 59, 255

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=60
Y=136
W=135
H=5
BarColor=100, 210, 255, 255
BarOrientation=Horizontal

[MeterCPUVal]
Meter=String
MeasureName=MeasureCPU
X=205
Y=130
FontSize=10
FontFace=Share Tech Mono
FontColor=100, 210, 255, 255
Text=%1%
AntiAlias=1

[MeterRAMLabel]
Meter=String
X=15
Y=162
FontSize=11
FontFace=Rajdhani
FontColor=255, 180, 70, 255
Text=RAM
AntiAlias=1

[MeterRAMBarBG]
Meter=Image
X=60
Y=168
W=135
H=5
SolidColor=30, 41, 59, 255

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=60
Y=168
W=135
H=5
BarColor=255, 180, 70, 255
BarOrientation=Horizontal

[MeterRAMVal]
Meter=String
MeasureName=MeasureRAM
X=205
Y=162
FontSize=10
FontFace=Share Tech Mono
FontColor=255, 180, 70, 255
Text=%1%
AntiAlias=1

; --- RIGHT CARD BACKGROUND (Clock) ---
[MeterRightCardBG]
Meter=Image
X=250
Y=0
W=160
H=200
SolidColor=15, 23, 42, 210

[MeterClockTitle]
Meter=String
MeasureName=MeasureTime
X=330
Y=75
StringAlign=Center
FontSize=32
FontFace=Orbitron
FontColor=100, 210, 255, 255
AntiAlias=1

[MeterSystemTag]
Meter=String
X=330
Y=155
StringAlign=Center
FontSize=12
FontFace=Rajdhani
FontColor=255, 180, 70, 255
Text=LIVE SYSTEM
AntiAlias=1
