app-id: com.github.kiddzhasi.TradRainmeter
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: trad-rainmeter-gui

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.DBus
  - --talk-name=org.mpris.MediaPlayer2.*
  - --filesystem=xdg-config/rainmeter-native:create
  - --filesystem=xdg-cache/trad-rainmeter:create
  - --filesystem=xdg-download:ro

modules:
  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TOOLS=OFF
      - -DBUILD_REGRESS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_DOC=OFF
      - -DENABLE_COMMONCRYPTO=OFF
      - -DENABLE_GNUTLS=OFF
      - -DENABLE_MBEDTLS=OFF
      - -DENABLE_OPENSSL=OFF
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.10.1.tar.xz
        sha256: dc3c8d5b4c8bbd09626864f6bcf93de701540f762676b85d7c7d710f4bd90318

  - name: lua
    no-autogen: true
    make-args:
      - linux
      - MYCFLAGS=-fPIC
    make-install-args:
      - INSTALL_TOP=/app
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.4.7.tar.gz
        sha256: 9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30

  - name: trad-rainmeter
    buildsystem: simple
    build-commands:
      - cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app
      - cmake --build build -j${FLATPAK_BUILDER_N_JOBS}
      - install -Dm755 build/rainmeter-native /app/bin/rainmeter-native
      - install -Dm755 build/rmskin-unpacker /app/bin/rmskin-unpacker
      - install -d /app/share/trad-rainmeter
      - install -Dm755 launcher_gui.py /app/share/trad-rainmeter/launcher_gui.py
      - cp -r assets suites widgets community gnome-extension /app/share/trad-rainmeter/
      - printf '#!/bin/sh\nexec python3 /app/share/trad-rainmeter/launcher_gui.py "$@"\n' > /app/bin/trad-rainmeter-gui
      - chmod 755 /app/bin/trad-rainmeter-gui
      - install -Dm644 flatpak/com.github.kiddzhasi.TradRainmeter.desktop /app/share/applications/com.github.kiddzhasi.TradRainmeter.desktop
      - install -Dm644 flatpak/com.github.kiddzhasi.TradRainmeter.metainfo.xml /app/share/metainfo/com.github.kiddzhasi.TradRainmeter.metainfo.xml
      - install -Dm644 assets/trad-engine.png /app/share/icons/hicolor/512x512/apps/com.github.kiddzhasi.TradRainmeter.png
    sources:
      - type: archive
        url: https://github.com/KidDzhasi/rainmeter-native-linux/archive/refs/tags/v1.1.0.tar.gz
        sha256: 9f76abf52933492875b3ee8dd2389689909ba8fa31c7636c41fddacbff5d4ef2
