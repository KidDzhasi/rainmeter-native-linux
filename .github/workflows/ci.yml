name: APT Build Check (Ubuntu & Pop!_OS)

on:
  push:
    branches: [ main, gnome-compatibility ]
  pull_request:
    branches: [ main ]

jobs:
  apt-build:
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install APT dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git dpkg-dev \
            wayland-protocols libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev \
            libegl-dev libgles-dev libepoxy-dev \
            libfontconfig-dev libzip-dev libcurl4-openssl-dev \
            liblua5.4-dev libglib2.0-dev libdbus-1-dev libpulse-dev \
            python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Build Engine & Verify .deb Packaging
        run: |
          python3 -m py_compile launcher_gui.py
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh 1.2.0
          dpkg-deb --info dist/trad-desktop_1.2.0_*.deb
