name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🛠️ Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgles2-mesa-dev libepoxy-dev

    - name: ⚙️ Compile C++ Engine
      run: |
        cmake -B build -S .
        cmake --build build --config Release

    - name: 📦 Package Application
      run: |
        mkdir -p dist/rainmeter-native
        cp build/rainmeter-native dist/rainmeter-native/ || true
        cp trad_launcher.py launch_trad.sh dist/rainmeter-native/
        cp -r assets suites dist/rainmeter-native/ 2>/dev/null || true
        tar -czvf rainmeter-native-linux-x86_64.tar.gz -C dist rainmeter-native

    - name: 🚀 Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: rainmeter-native-linux-x86_64.tar.gz
        generate_release_notes: true
