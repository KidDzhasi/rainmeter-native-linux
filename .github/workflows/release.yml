name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0)'
        required: false
        default: '1.2.0'

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install APT Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git dpkg-dev \
            wayland-protocols libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev \
            libegl-dev libgles-dev libepoxy-dev \
            libfontconfig-dev libzip-dev libcurl4-openssl-dev \
            liblua5.4-dev libglib2.0-dev libdbus-1-dev libpulse-dev

      - name: ⚙️ Compile C++ Engine
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j"$(nproc)"

      - name: 📦 Build .deb APT Package & Portable Tarball
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          fi
          chmod +x scripts/build-deb.sh install-apt.sh
          ./scripts/build-deb.sh "${TAG_VER}"

          mkdir -p dist/trad-desktop
          cp build/rainmeter-native build/rmskin-unpacker dist/trad-desktop/
          cp launcher_gui.py install-apt.sh README.md LICENSE dist/trad-desktop/
          cp -r assets suites widgets community gnome-extension dist/trad-desktop/
          tar -czvf dist/trad-desktop-linux-x86_64.tar.gz -C dist trad-desktop

          python3 -c 'import zipfile, os; src="gnome-extension/trad-desktop@kiddzhasi.github.com"; z=zipfile.ZipFile("dist/trad-desktop@kiddzhasi.github.com.shell-extension.zip","w",zipfile.ZIP_DEFLATED); [z.write(os.path.join(src,f), f) for f in sorted(os.listdir(src))]; z.close()'

      - name: 📦 Build Flatpak Bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak librsvg2-common shared-mime-info
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform/x86_64/51 org.gnome.Sdk/x86_64/51
          chmod +x scripts/build-flatpak.sh
          ./scripts/build-flatpak.sh

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/trad-desktop_*.deb
            dist/trad-desktop-linux-x86_64.tar.gz
            dist/trad-desktop@kiddzhasi.github.com.shell-extension.zip
            dist/trad-desktop.flatpak
          generate_release_notes: true
