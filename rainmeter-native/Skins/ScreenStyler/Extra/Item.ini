[Rainmeter]
Author=Xyrfo and fediaFedia
Update=-1
MouseActionCursor=1
OnRefreshAction=[!WriteKeyValue Rainmeter OnRefreshAction "!DeactivateConfig"]

[Variables]
@include=#@#Global.inc

[Text]
Meter=String
SolidColor=0,0,0,1
X=(#WorkAreaWidth#-80)
Y=(#WorkAreaHeight#-120)
FontFace=Segoe UI
FontSize=(12*#scaledpiothers#)
FontColor=255,255,255,150
StringAlign=RIGHT
AntiAlias=1
MouseActionCursor=1
Text=Created with ScreenStyler.com#CRLF#BETA VERSION #ProductVersion#
LeftMouseUpAction=!execute ["https://screenstyler.com/desktop/?ref=beta&v=#ProductVersion#"]

[Text2]
Meter=String
SolidColor=0,0,0,1
X=r
Y=R
FontFace=Segoe UI
FontSize=12
FontColor=255,255,255,200
StringAlign=RIGHT
AntiAlias=1
MouseActionCursor=1
Text=Click here to close [x]
LeftMouseUpAction=!DeactivateConfig
