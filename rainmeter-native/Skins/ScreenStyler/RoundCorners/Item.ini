[Rainmeter]
Author=ScreenStyler
Update=-1
OnRefreshAction=[!ZPos "2"][!KeepOnScreen "0"][!ClickThrough "1"]

[Variables]
@include=#@#Global.inc


[s]
solidcolor=0,0,0,0
ImageName=corner.png
W=#ScreenCornerRadius#*#scaledpiothers#
H=#ScreenCornerRadius#*#scaledpiothers#



[1]
Meter=Image
meterstyle=s
x=0

[2]
Meter=Image
meterstyle=s
x=(#screenareawidth# - #ScreenCornerRadius#)
ImageFlip=horizontal


[3]
Meter=Image
meterstyle=s
x=0
y=(#screenareaheight# - #ScreenCornerRadius#)
ImageFlip=vertical

[4]
Meter=Image
meterstyle=s
x=(#screenareawidth# - #ScreenCornerRadius#)
y=(#screenareaheight# - #ScreenCornerRadius#)
ImageFlip=both