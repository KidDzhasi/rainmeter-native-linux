[CustomMessageMeter]
meter=image
solidcolor=0,0,0
h=19
w=145
x=120
y=100
antialias=1
dynamicvariables=1

LeftMouseDownAction=[!CommandMeasure CustomMessageInput "ExecuteBatch 1"][!Update][!Redraw]

[CustomMessageText]
meter=string
X=[CustomMessageMeter:X]
Y=[CustomMessageMeter:Y]
H=[CustomMessageMeter:H]
W=[CustomMessageMeter:W]
FontFace=#defaultfont#
FontSize=11
FontColor=255,255,255
SolidColor=50,50,50
ClipString=2
StringAlign=Left
dynamicvariables=1
Text="#CustomMessage#"

[CustomMessageInput]
Measure=Plugin
Plugin=InputText
X=[CustomMessageMeter:X]
Y=[CustomMessageMeter:Y]
H=[CustomMessageMeter:H]
W=[CustomMessageMeter:W]
SolidColor=150,150,150,255
FontFace=#defaultfont#
FontSize=11
FontColor=0,0,0
ClipString=2
StringAlign=Left
dynamicvariables=1
BevelType=1
AntiAlias=1
FocusDismiss=1
DefaultValue="#CustomMessage#"
Hidden=1
Command1=[!WriteKeyValue Variables CustomMessage "$UserInput$" "#options#"][!Update][!Redraw][!Refresh][!Refresh "Magnumizer's Countdown Timer"]








;sound
[Event1]
meter=image
imagename=#@#Images\sound.png
ImageAlpha=50,50,50,50
h=20
w=20
x=40
y=150
ToolTipText="play sound"
antialias=1
dynamicvariables=1

LeftMouseDownAction=["#@#RainFile\RainFile.exe" "File" "Variables" "TZeroSound" "#options#" "#@#Sounds\"][!Update][!Redraw][!Refresh "Magnumizer's Countdown Timer"]

[DisableEvent1]
meter=string
FontFace=#defaultfont#
FontColor=#TextColor#
StringAlign=center
FontSize=8
Text="[disable]"
x=([Event1:X]+([Event1:W]/2))
y=175
hidden=1

LeftMouseDownAction=[!WriteKeyValue Variables TZeroSound "" "#options#"][!Update][!Redraw][!Refresh][!Refresh "Magnumizer's Countdown Timer"]

[Event1Checker]
measure=string
string=#TZeroSound#
ifmatchmode=1
ifmatch=wav
ifmatchaction=[!SetOption Event1 ImageAlpha "255,255,255,255"][!ShowMeter DisableEvent1]
ifnotmatchaction=[!SetOption Event1 ImageAlpha "50,50,50,50"][!HideMeter DisableEvent1]





