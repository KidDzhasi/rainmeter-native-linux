[Rainmeter]
ContextTitle="Save / Close"
ContextAction=[Play #CSSound#][!Refresh "Magnumizer's Countdown Timer"][!ToggleConfig "#CURRENTCONFIG#" "#CURRENTFILE#"]
RightMouseUpAction=!SkinCustomMenu
AccurateText=1

[Metadata]
Name=Options UI
Author=Magnumizer
Information=Control the functionality and aesthetics of the countdown timer
License=
Version=


[Variables]
TextColor=200,200,200
BackgroundColor=0,0,0,200
SliderPosition=130
options=#CURRENTPATH#\options.inc

@include=#CURRENTPATH#\options.inc

defaultfont=Corbel
mainC1=143
mainC2=192
mainC3=227
outlineC1=143
outlineC2=192
outlineC3=227
subC1=209
subC2=111
subC3=69
Format=m/s

seconds=1
minutes=1
hours=1
days=1
months=1
years=0



[Background]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,285,670,15 | Extend MyModifiers1
MyModifiers1=Fill Color #BackgroundColor# | StrokeWidth 1 | Stroke Color #TimerSetColor#
dynamicvariables=1


[BackgroundLayer]
Meter=Image
SolidColor=0,0,0,1
w=#SCREENAREAWIDTH#
h=#SCREENAREAHEIGHT#
hidden=1
group=fontlist | formatlist

LeftMouseDownAction=[!HideMeterGroup fontlist][!HideMeterGroup formatlist][!Update]

[Headline]
Meter=string
MeasureName=Headline
FontFace=Caviar Dreams
FontColor=#TextColor#
FontSize=18
StringAlign=Center
AntiAlias=1
Text="OPTIONS"
x=([Background:x]+([Background:w]/2))
y=13

[headlineunderline]
meter=image
solidcolor=#TextColor#
y=45
x=(([Background:x]+([Background:w]/2))/2)
h=2
w=140



[Selector]
meter=image
ImageName=#@#Images\darkselected.png
h=13
preserveaspectratio=1
y=20
x=24
dynamicvariables=1


[Switch2Dark]
meter=image
solidcolor=0,0,0,1
x=25
y=20
h=10
w=10

LeftMouseDownAction=[!WriteKeyValue Variables OptionsTheme "0" "#options#"][!WriteKeyValue Variables TextColor "200,200,200" "#CURRENTPATH#Options.ini"][!WriteKeyValue Variables BackgroundColor "0,0,0,200" "#CURRENTPATH#Options.ini"][!Update][!Redraw][!Refresh]

[Switch2Light]
meter=image
solidcolor=0,0,0,1
x=R
y=20
h=12
w=12

LeftMouseDownAction=[!WriteKeyValue Variables OptionsTheme "1" "#options#"][!WriteKeyValue Variables TextColor "20,10,10" "#CURRENTPATH#Options.ini"][!WriteKeyValue Variables BackgroundColor "250,250,250,200" "#CURRENTPATH#Options.ini"][!Update][!Redraw][!Refresh]

[ThemeHandler]
measure=calc
formula=00

ifcondition=(#OptionsTheme# = 0)
iftrueaction=[!SetOption Selector ImageName "#@#Images\darkselected.png"][!SetOption HelpIcon ImageName "#@#Images\helpdark.png"][!SetVariable BackgroundColor "0,0,0,245"]
iffalseaction=[!SetOption Selector ImageName "#@#Images\lightselected.png"][!SetOption HelpIcon ImageName "#@#Images\helplight.png"][!SetVariable BackgroundColor "250,250,250,245"]






[HelpIcon]
meter=image
imagename=#@#Images\helpdark.png
imagealpha=200
x=238
y=16
h=22
preserveaspectratio=1
antialias=1
tooltiptext="help"
dynamicvariables=1

MouseOverAction=[!SetOption HelpIcon ImageAlpha "255"][!Update][!Redraw]
MouseLeaveAction=[!SetOption HelpIcon ImageAlpha "200"][!Update][!Redraw]
LeftMouseDownAction=["#ROOTCONFIGPATH#help.txt"][!Update]





[MenuList]
Meter=string
FontFace=#defaultfont#
FontColor=#TextColor#
FontSize=12
Text="#CRLF#Click sound#CRLF#Final 10 seconds sound#CRLF#End message:"
x=20
y=40


[MenuList2]
