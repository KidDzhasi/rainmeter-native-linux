LeftMouseDownAction=[!SetOption OFFTick FontColor 255,50,50,255][!WriteKeyValue Variables OFFTickColor "255,50,50,255" "#options#"][!SetOption Last10SecondsTick FontColor 50,200,50,100][!WriteKeyValue Variables Last10SecondsTickColor "50,200,50,100" "#options#"][!WriteKeyValue Variables L10SSound "" "#options#"][Play #CSSound#][!Update][!Redraw][!Refresh "Magnumizer's Countdown Timer"]




[EndMessageBox]
Meter=Image
ImageName=#@#Images\boxchecked.png
x=5
y=100
h=14
preserveaspectratio=1

LeftMouseDownAction=[!SetVariable EndMessageOn "0"][!WriteKeyValue Variables EndMessageOn "0" "#options#"][!ShowMeter EndMessageBoxUnchecked][!HideMeter EndMessageBox][!Update][!Redraw][!Refresh "Magnumizer's Countdown Timer"][!UpdateMeasure "DisplayEndMessage"]

[EndMessageBoxUnchecked]
