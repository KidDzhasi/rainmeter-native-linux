[Rainmeter]
ContextTitle="Hide underline"
ContextAction=[!SetVariable TitleUnderline "0"][!WriteKeyValue Variables TitleUnderline "0" "#ROOTCONFIGPATH#Options\options.inc"][!UpdateMeasure "ContextMeasure"]
ContextTitle2=----
ContextAction2=[]
ContextTitle3="Options"
ContextAction3=[!ActivateConfig "Magnumizer's Countdown Timer\Options" "Options.ini"][Play #CSSound#]
ContextTitle4=----
ContextAction4=[]
ContextTitle5="Rainmeter options     -->"
ContextAction5=[!SkinMenu]
ContextTitle6=----
ContextAction6=[]
ContextTitle7="Hide title"
ContextAction7=[Play #CSSound#][!WriteKeyValue Variables TitleOn "0" "#ROOTCONFIGPATH#Options\options.inc"][!ToggleConfig "#CURRENTCONFIG#" "#CURRENTFILE#"][!Refresh "Magnumizer's Countdown Timer\Options"][!Refresh "Magnumizer's Countdown Timer"]
RightMouseUpAction=!SkinCustomMenu
AccurateText=1

[Metadata]
Name=Title
Author=Magnumizer
Information=A title for the countdown timer
License=
Version=

[Variables]
@include=#ROOTCONFIGPATH#Options\options.inc

[TitleMeter]
Meter=String
FontFace=#Font#
Fontsize=#TitleSize#
FontColor=#Color1#
StringEffect=#StringOutline#
FontEffectColor=#Color2#
DynamicVariables=1
AntiAlias=1
Text=#TitleText#

[Underline]
meter=image
solidcolor=#Color#
DynamicVariables=1
AntiAlias=1
h=2
w=[TitleMeter:W]
y=5R


[Overlay]
meter=image
solidcolor=0,0,0,1
dynamicvariables=1
w=[TitleMeter:W]
h=([TitleMeter:H]+30)


[ContextMeasure]
measure=calc
formula=#TitleUnderline#
dynamicvariables=1
updatedivider=-1
ifconditionmode=1
ifcondition=(#TitleUnderline# = 1)
iftrueaction=[!ShowMeter Underline][!SetOption Rainmeter ContextTitle "Hide underline"][!SetOption Rainmeter ContextAction """[!SetVariable TitleUnderline "0"][!WriteKeyValue Variables TitleUnderline "0" "#ROOTCONFIGPATH#Options\options.inc"][!UpdateMeasure "ContextMeasure"]"""][!Update]
iffalseaction=[!HideMeter Underline][!SetOption Rainmeter ContextTitle "Show underline"][!SetOption Rainmeter ContextAction """[!SetVariable TitleUnderline "1"][!WriteKeyValue Variables TitleUnderline "1" "#ROOTCONFIGPATH#Options\options.inc"][!UpdateMeasure "ContextMeasure"]"""][!Update]

