[Rainmeter]
Author=Magnumizer
Update=1000
AccurateText=1
AntiAlias=1
OnRefreshAction=[!SetVariable HideCountdown "0"][!WriteKeyValue Variables HideCountdown "0"]

ContextTitle="Show title"
ContextAction=[!SetVariable TitleOn "1"][!WriteKeyValue Variables TitleOn "1" "#CURRENTPATH#\Options\options.inc"][!UpdateMeasure "ContextMeasure"][!Refresh "Magnumizer's Countdown Timer\Options"][!ActivateConfig "Magnumizer's Countdown Timer\Title" "Title.ini"]
ContextTitle2=----
ContextAction2=[]
ContextTitle3="Switch to: CountDown"
ContextAction3=[!ActivateConfig "Magnumizer's Countdown Timer" "CountDownTimer.ini"][Play #CSSound#]
ContextTitle4=----
ContextAction4=[]
ContextTitle5="Options"
ContextAction5=[!ActivateConfig "Magnumizer's Countdown Timer\Options" "Options.ini"][Play #CSSound#]
ContextTitle6=----
ContextAction6=[]
ContextTitle7="Rainmeter options     -->"
ContextAction7=[!SkinMenu]
ContextTitle8=----
ContextAction8=[]
ContextTitle9="Unload skin"
ContextAction9= [!DeactivateConfig "Magnumizer's Countdown Timer" "CountUpTimer.ini"][!DeactivateConfig "Magnumizer's Countdown Timer\Options" "Options.ini"][!DeactivateConfig "Magnumizer's Countdown Timer\Title" "Title.ini"][Play #CSSound#]
RightMouseUpAction=!SkinCustomMenu


[Metadata]
Name=Countup Timer
Author=Magnumizer
Information="Count up from a specific time and date that you set."
Version=3.3

[Variables]
Year=2020
Month=12
Day=31
Hour=23
Minute=55
Second=0
YearCount=0
MonthCount=0
DayCount=0
HourCount=0
MinuteCount=2
SecondCount=30
TTMprefix=0
TTHprefix=0
HideCountdown=0
CurrentSkinWidth=450
CurrentSkinHeight=77
TimerSetFont=Open 24 Display St
TimerSetFont2=Caviar Dreams
TimerStarted=07:53   (17/06 - 2020)
FromToday=0

options=#CURRENTPATH#\Options\options.inc
@include=#options#





[TodaysDate]
Measure=time
Format=%H:%M   (%d/%m - %Y)




