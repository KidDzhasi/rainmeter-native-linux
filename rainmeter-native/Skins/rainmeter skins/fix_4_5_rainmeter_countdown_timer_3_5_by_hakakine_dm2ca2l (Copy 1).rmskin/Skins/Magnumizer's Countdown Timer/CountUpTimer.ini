[ContextMeasure]
measure=calc
formula=#TitleOn#
dynamicvariables=1
updatedivider=-1
ifconditionmode=1
ifcondition=(#TitleOn# = 1)
iftrueaction=[!SetOption Rainmeter ContextTitle "Hide title"][!SetOption Rainmeter ContextAction """[!SetVariable TitleOn "0"][!WriteKeyValue Variables TitleOn "0" "#CURRENTPATH#\Options\options.inc"][!UpdateMeasure "ContextMeasure"][!Refresh "Magnumizer's Countdown Timer\Options"][!DeactivateConfig "Magnumizer's Countdown Timer\Title" "Title.ini"]"""]
iffalseaction=[!SetOption Rainmeter ContextTitle "Show title"][!SetOption Rainmeter ContextAction """[!SetVariable TitleOn "1"][!WriteKeyValue Variables TitleOn "1" "#CURRENTPATH#\Options\options.inc"][!UpdateMeasure "ContextMeasure"][!Refresh "Magnumizer's Countdown Timer\Options"][!ActivateConfig "Magnumizer's Countdown Timer\Title" "Title.ini"]"""]




[TitleActiveCheck]
Measure=Calc
formula=#TitleOn#
DynamicVariables=1
updatedivider=-1
IfCondition=(#TitleOn# = 1)
IfTrueAction=[!ActivateConfig "Magnumizer's Countdown Timer\Title" "Title.ini"]
IfFalseAction=[!DeactivateConfig "Magnumizer's Countdown Timer\Title" "Title.ini"]



[minmaxerSize]
measure=calc
formula=#Size#
DynamicVariables=1
ifconditionmode=1
IfCondition=(#Size# < 0.5)
IfTrueAction=[!SetVariable Size "0.5"]
IfCondition2=(#Size# > 1.5)
IfTrueAction2=[!SetVariable Size "1.5"]

[minmaxerHour]
measure=calc
formula=#Hour#
DynamicVariables=1
ifconditionmode=1
IfCondition=(#Hour# < 0)
IfTrueAction=[!SetVariable Hour "23"]
IfCondition2=(#Hour# > 23)
IfTrueAction2=[!SetVariable Hour "0"]

[minmaxerMinute]
measure=calc
formula=#Minute#
DynamicVariables=1
ifconditionmode=1
IfCondition=(#Minute# < 0)
IfTrueAction=[!SetVariable Minute "55"]
IfCondition2=(#Minute# > 59)
IfTrueAction2=[!SetVariable Minute "0"]

[minmaxerDay]
measure=calc
formula=#Day#
DynamicVariables=1
ifconditionmode=1
IfCondition=(#Day# < 1)
IfTrueAction=[!SetVariable Day "31"]
IfCondition2=(#Day# > 31)
IfTrueAction2=[!SetVariable Day "1"]

[minmaxerMonth]
measure=calc
formula=#Month#
DynamicVariables=1
ifconditionmode=1
IfCondition=(#Month# < 1)
IfTrueAction=[!SetVariable Month "12"]
