<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Blue Gradient Background (Inspired by the 'Plus' icon) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" /> <!-- Dark Slate -->
      <stop offset="50%" stop-color="#1E3A8A" /> <!-- Royal Blue -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Vibrant Cyan/Blue -->
    </linearGradient>

    <!-- Top Face Gradient (White to subtle metallic blue) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 3D Text Extrusion Group -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', sans-serif" 
     font-weight="900" 
     font-size="140" 
     text-anchor="middle" 
     dominant-baseline="central" 
     letter-spacing="8">
    
    <!-- Shadow Extrusion Layers (Darker blues blending upward) -->
    <text x="270" y="270" fill="#020617">TRAD</text>
    <text x="269" y="269" fill="#050B1F">TRAD</text>
    <text x="268" y="268" fill="#081126">TRAD</text>
    <text x="267" y="267" fill="#0C172E">TRAD</text>
    <text x="266" y="266" fill="#0F1D35">TRAD</text>
    <text x="265" y="265" fill="#13233D">TRAD</text>
    <text x="264" y="264" fill="#162944">TRAD</text>
    <text x="263" y="263" fill="#192E4C">TRAD</text>
    <text x="262" y="262" fill="#1D3453">TRAD</text>
    <text x="261" y="261" fill="#203A5B">TRAD</text>
    <text x="260" y="260" fill="#244062">TRAD</text>
    <text x="259" y="259" fill="#27466A">TRAD</text>
    <text x="258" y="258" fill="#2B4C71">TRAD</text>
    <text x="257" y="257" fill="#2E5279">TRAD</text>
    
    <!-- Bright Top Face -->
    <text x="256" y="256" fill="url(#topFace)">TRAD</text>
  </g>
</svg>
